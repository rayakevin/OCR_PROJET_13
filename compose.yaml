x-milvus-image: &milvus-image milvusdb/milvus:v3.0.2

services:
  api:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    environment:
      LICHESS_API_TOKEN: ${LICHESS_API_TOKEN}
      MILVUS_URI: "http://standalone:19530"
      MONGODB_URI: "mongodb://mongodb:27017"
      HF_TOKEN: ${HF_TOKEN}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy

  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    image: *milvus-image
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started

  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - api

  corpus-init:
    image: ${COMPOSE_PROJECT_NAME:-projet_13}-api
    pull_policy: never
    profiles:
      - setup
    environment:
      MILVUS_URI: "http://standalone:19530"
    volumes:
      - type: bind
        source: ./resources/corpus
        target: /corpus
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      standalone:
        condition: service_healthy
    command: ["python", "-m", "backend.app.commands.index_milvus", "--bundle", "/corpus/chess-openings-fr-v1.zip"]

  embedding-init:
    image: ${COMPOSE_PROJECT_NAME:-projet_13}-api
    pull_policy: never
    profiles:
      - setup
    user: "0:0"
    environment:
      HF_HUB_CACHE: "/models/hub"
    volumes:
      - embedding_cache:/models/hub
      - ./backend/app/commands/download_embedding_model.py:/tmp/download_embedding_model.py:ro
    command: ["python", "/tmp/download_embedding_model.py"]

volumes:
  mongodb_data:
  embedding_cache:
